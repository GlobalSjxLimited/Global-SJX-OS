name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"   # weekly dependency audit (A.8.8)
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit            # strict type-check (A.8.28)
      - run: npm test                    # security unit + HTTP tests (A.8.29)
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev   # fail on high/critical vulnerabilities
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
